name: centrow_sales
description: "Centrow Sales - Mobile ERP & POS application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  get_it: ^9.2.1
  dio: ^5.8.0+1
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.5
  collection: ^1.18.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  webview_flutter: ^4.14.1
  open_filex: ^4.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/img/app_icon_full.png"
  adaptive_icon_background: "assets/img/app_icon_background.png"
  adaptive_icon_foreground: "assets/img/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/img/app_icon_full.png"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/js/
