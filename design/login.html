<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Masuk — Centrow Sales</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/tablet.css"/>
  <style>
    /* Centered Minimalist Login Layout */
    body {
      background: var(--page);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .login-logo {
      width: 52px;
      height: 52px;
      background: var(--brand);
      color: #FFFFFF;
      border-radius: var(--r-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 26px;
      font-weight: 800;
      box-shadow: var(--sh-brand);
      margin-bottom: 12px;
    }

    .login-app-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .login-app-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .login-card {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r-xl);
      padding: 28px 24px;
      box-shadow: var(--sh-md);
      box-sizing: border-box;
    }

    .demo-bar {
      background: var(--subtle);
      border: 1.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 8px 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .demo-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--sec);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .demo-chips {
      display: flex;
      gap: 6px;
    }
    .demo-chip {
      height: 28px;
      padding: 0 10px;
      border-radius: var(--r-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--sec);
      cursor: pointer;
      transition: all 0.12s;
    }
    .demo-chip:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    .demo-chip.active {
      background: var(--brand-10);
      border-color: var(--brand);
      color: var(--brand);
    }

    .login-field {
      margin-bottom: 16px;
    }
    .login-field label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--sec);
      margin-bottom: 6px;
    }

    .input-with-icon {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-with-icon svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      pointer-events: none;
    }
    .input-with-icon .field-inp {
      padding-left: 42px;
      padding-right: 42px;
      height: 46px;
      font-size: 14px;
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pwd:hover {
      color: var(--text);
    }

    .login-footer-meta {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
    }
  </style>
</head>
<body>

<div class="login-wrapper">

  <!-- Minimal Brand Header -->
  <div class="login-brand-header">
    <div class="login-logo">C</div>
    <div class="login-app-title">Centrow Sales</div>
    <div class="login-app-sub">CV Nohama Indonesia · Cabang Bali</div>
  </div>

  <!-- Focused Login Card -->
  <div class="login-card">

    <!-- Quick Role Selector (Demo) -->
    <div class="demo-bar">
      <span class="demo-label">Pilih Akun:</span>
      <div class="demo-chips">
        <button type="button" class="demo-chip active" onclick="setDemo('agus@nohama.id', 'Agus — Sales Bali')">Agus (Sales)</button>
        <button type="button" class="demo-chip" onclick="setDemo('supervisor@nohama.id', 'Budi — Supervisor')">Supervisor</button>
        <button type="button" class="demo-chip" onclick="setDemo('admin@nohama.id', 'Admin Cabang')">Admin</button>
      </div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <!-- Email / Username Field -->
      <div class="login-field">
        <label for="f-email">Email / Nama Pengguna</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input class="field-inp" type="email" id="f-email" value="agus@nohama.id" required placeholder="nama@nohama.id"/>
        </div>
      </div>

      <!-- Password Field -->
      <div class="login-field">
        <label for="f-pass">Kata Sandi</label>
        <div class="input-with-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="field-inp" type="password" id="f-pass" value="password123" required placeholder="••••••••"/>
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="Lihat Sandi">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="pwd-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <!-- Operational Branch -->
      <div class="login-field">
        <label for="f-branch">Cabang Operasional</label>
        <select class="field-sel" id="f-branch" style="height:46px;">
          <option selected>Cabang Bali (Denpasar &amp; Badung)</option>
          <option>Cabang Jawa Timur (Surabaya)</option>
          <option>Cabang Jakarta</option>
        </select>
      </div>

      <!-- Forgot Password Link -->
      <div style="display:flex;justify-content:flex-end;margin:12px 0 22px;">
        <a href="#" style="font-size:12.5px;color:var(--brand);text-decoration:none;font-weight:600;" onclick="showToast('Silakan hubungi IT Nohama untuk bantuan sandi.');return false;">Lupa kata sandi?</a>
      </div>

      <!-- Submit CTA Button -->
      <button type="submit" class="btn btn-primary" id="btn-submit" style="width:100%;height:48px;font-size:15px;justify-content:center;gap:8px;">
        <span>Masuk ke Sistem</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </form>
  </div>

  <!-- Operational Footer Meta -->
  <div class="login-footer-meta">
    <div class="status-dot"></div>
    <span>v2.4.0 · Server Operasional Bali Online</span>
  </div>

</div>

<!-- TOAST NOTIFICATION CONTAINER -->
<div id="toast" class="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-msg"></span>
</div>

<script src="js/tablet.js"></script>
<script>
function togglePasswordVisibility() {
  const inp = document.getElementById('f-pass');
  const isPwd = inp.type === 'password';
  inp.type = isPwd ? 'text' : 'password';
}

function setDemo(email, label) {
  document.getElementById('f-email').value = email;
  document.getElementById('f-pass').value = 'password123';
  document.querySelectorAll('.demo-chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  showToast('Akun dialihkan ke ' + label);
}

function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.innerHTML = `
    <svg style="animation:spin 0.8s linear infinite;width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
    <span>Memverifikasi...</span>
  `;
  
  showToast('Berhasil masuk. Memuat beranda...');
  
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 700);
}
</script>
<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
</body>
</html>
